[project]
name = "thermal-counterfactual-gb"
version = "0.1.0"
description = "Thermal Envelope as a Passive Grid Asset — fabric retrofit as a counterfactual grid-flexibility asset for UK social housing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.9",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "streamlit>=1.38",
    "jupyter>=1.1.1",
    "lab>=8.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermal_counterfactual_gb"]
